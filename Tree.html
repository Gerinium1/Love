<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Szerelmes oldal</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(120deg, #ff5f9e, #ffc371);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #333;
    }

    .card {
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      width: 90%;
      max-width: 900px;
      display: flex;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }

    .text {
      flex: 1;
    }

    h1 {
      margin-top: 0;
      color: #ff4081;
    }

    #timer {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    canvas {
      flex: 1;
      background: #fff5f9;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="text">
      <h1>Életem szerelmének ❤️</h1>
      <p>
        Ha választhatnék egy biztonságos helyet,  
        az mindig a te oldalad lenne.
      </p>

      <div id="timer"></div>
    </div>

    <canvas id="tree" width="400" height="400"></canvas>
  </div>

  <script>
    // --------- IDŐSZÁMLÁLÓ ----------
    const startDate = new Date("2024-02-15T00:00:00"); // <-- IDE ÍRD BE a dátumotokat!

    function updateTimer() {
      const now = new Date();
      let diff = Math.floor((now - startDate) / 1000);

      const days = Math.floor(diff / (60 * 60 * 24));
      diff %= 60 * 60 * 24;
      const hours = Math.floor(diff / (60 * 60));
      diff %= 60 * 60;
      const minutes = Math.floor(diff / 60);
      const seconds = diff % 60;

      document.getElementById("timer").innerHTML =
        `Együtt vagyunk: <br>
        ${days} nap ${hours} óra ${minutes} perc ${seconds} másodperc`;
    }

    setInterval(updateTimer, 1000);
    updateTimer();

    // --------- SZÍV FA ANIMÁCIÓ ----------
    const canvas = document.getElementById("tree");
    const ctx = canvas.getContext("2d");

    let hearts = [];

    function drawHeart(x, y, size) {
      ctx.fillStyle = "red";
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.bezierCurveTo(x - size, y - size, x - size * 2, y + size / 2, x, y + size * 2);
      ctx.bezierCurveTo(x + size * 2, y + size / 2, x + size, y - size, x, y);
      ctx.fill();
    }

    function drawTree() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Törzs
      ctx.fillStyle = "#8d5a2b";
      ctx.fillRect(190, 200, 20, 120);

      hearts.forEach(h => {
        drawHeart(h.x, h.y, h.size);
      });
    }

    function growTree() {
      if (hearts.length < 80) {
        hearts.push({
          x: 200 + (Math.random() * 120 - 60),
          y: 200 + (Math.random() * 120 - 60),
          size: 5 + Math.random() * 5
        });
      }
      drawTree();
    }

    setInterval(growTree, 200);
  </script>

</body>
</html>
