<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szerelmemnek</title>
    <style>
        :root {
            --bg-color: #fce4ec;
            --text-color: #d81b60;
            --trunk-color: #5d4037;
            --heart-color: #ff4081;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h2 { color: var(--text-color); margin-bottom: 5px; }
        p { color: #666; font-style: italic; margin-top: 0; }

        /* --- Animált Fa (SVG) --- */
        .tree-svg {
            width: 250px;
            height: 250px;
            margin: 20px auto;
        }

        /* Törzs animáció */
        .trunk {
            stroke: var(--trunk-color);
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 2s ease-out forwards;
        }

        /* Ágak animációja késleltetve */
        .branch {
            stroke: var(--trunk-color);
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 1.5s ease-out forwards;
            animation-delay: 1.5s;
        }

        /* Szív levelek animációja */
        .heart {
            fill: var(--heart-color);
            transform: scale(0);
            transform-origin: center;
            animation: growHeart 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }

        @keyframes growHeart {
            to { transform: scale(1); }
        }

        /* Időzített megjelenés a leveleknek */
        .h1 { animation-delay: 2.5s; }
        .h2 { animation-delay: 2.7s; }
        .h3 { animation-delay: 2.9s; }
        .h4 { animation-delay: 3.1s; }
        .h5 { animation-delay: 3.3s; }
        .h6 { animation-delay: 3.5s; }

        /* Számláló stílus */
        .timer-box {
            margin-top: 25px;
            padding: 15px;
            background: #fff1f1;
            border-radius: 15px;
            color: var(--text-color);
            font-weight: bold;
        }

        #counter { font-size: 1.1rem; display: block; margin-top: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Para el amor de mi vida:</h2>
    <p>Si pudiera elegir un lugar seguro, sería a tu lado.</p>

    <svg class="tree-svg" viewBox="0 0 200 200">
        <path class="trunk" d="M100,180 Q100,140 100,100" fill="none" stroke-width="8" stroke-linecap="round"/>
        
        <path class="branch" d="M100,120 Q70,90 50,100" fill="none" stroke-width="5" stroke-linecap="round"/>
        <path class="branch" d="M100,110 Q130,70 150,80" fill="none" stroke-width="5" stroke-linecap="round"/>
        <path class="branch" d="M100,140 Q140,120 160,130" fill="none" stroke-width="4" stroke-linecap="round"/>
        <path class="branch" d="M100,130 Q60,110 40,140" fill="none" stroke-width="4" stroke-linecap="round"/>

        <path class="heart h1" d="M50,100 c-5-5-10,0-10,5 c0,5,10,10,10,10 c0,0,10-5,10-10 c0-5-5-10-10-5" transform="translate(-10, -10)"/>
        <path class="heart h2" d="M150,80 c-5-5-10,0-10,5 c0,5,10,10,10,10 c0,0,10-5,10-10 c0-5-5-10-10-5" transform="translate(-10, -10)"/>
        <path class="heart h3" d="M160,130 c-5-5-10,0-10,5 c0,5,10,10,10,10 c0,0,10-5,10-10 c0-5-5-10-10-5" transform="translate(-10, -10)"/>
        <path class="heart h4" d="M40,140 c-5-5-10,0-10,5 c0,5,10,10,10,10 c0,0,10-5,10-10 c0-5-5-10-10-5" transform="translate(-10, -10)"/>
        <path class="heart h5" d="M100,80 c-5-5-10,0-10,5 c0,5,10,10,10,10 c0,0,10-5,10-10 c0-5-5-10-10-5" transform="translate(-10, -10)"/>
        <path class="heart h6" d="M80,60 c-5-5-10,0-10,5 c0,5,10,10,10,10 c0,0,10-5,10-10 c0-5-5-10-10-5" transform="translate(-10, -10)"/>
    </svg>

    <div class="timer-box">
        Mi amor por ti comenzó hace...
        <span id="counter">Számolás...</span>
    </div>
</div>

<script>
    // Állítsd be a dátumot (Év, Hónap-1, Nap, Óra, Perc)
    const startDate = new Date(2024, 1, 14, 0, 0, 0); 

    function updateCounter() {
        const now = new Date();
        const diff = now - startDate;

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const mins = Math.floor((diff / 1000 / 60) % 60);
        const secs = Math.floor((diff / 1000) % 60);

        document.getElementById('counter').innerText = 
            `${days} nap ${hours} óra ${mins} perc ${secs} mp`;
    }

    setInterval(updateCounter, 1000);
    updateCounter();
</script>

</body>
</html>
