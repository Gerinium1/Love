<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Love</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #ff8fb1, #ff2e63);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(6px);
      padding: 20px;
      border-radius: 20px;
      width: 95%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,.25);
      z-index: 2;
    }

    h1 { margin: 0 0 8px; color: #ff2e63; }
    #timer { font-weight: 700; }

    canvas {
      width: 100%;
      max-width: 420px;
      height: auto;
      background: linear-gradient(#fff0f6, #ffe3ed);
      border-radius: 16px;
    }

    @media (max-width: 700px) {
      .card { grid-template-columns: 1fr; text-align: center; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div>
      <h1>Életem szerelmének ❤️</h1>
      <p>Ha választhatnék egy biztonságos helyet, az mindig a te oldalad lenne.</p>
      <div id="timer"></div>
    </div>
    <canvas id="tree" width="420" height="420"></canvas>
  </div>

  <script>
    // ⏱️ DÁTUM – ide írd a tiéteket
    const startDate = new Date("2024-08-18-T00:00:00");
    function updateTimer() {
      const now = new Date();
      let d = Math.floor((now - startDate) / 1000);
      const days = Math.floor(d / 86400); d %= 86400;
      const h = Math.floor(d / 3600); d %= 3600;
      const m = Math.floor(d / 60);
      const s = d % 60;
      timer.innerText = `Együtt: ${days} nap ${h} óra ${m} perc ${s} mp`;
    }
    setInterval(updateTimer, 1000); updateTimer();

    // 🌳 FA NÖVÉS + SZÍV SZIRMOK
    const c = document.getElementById("tree");
    const ctx = c.getContext("2d");

    let trunkH = 0;          // törzs magasság
    let branches = 0;        // ág "erősség"
    const leaves = [];
    let phase = 0;           // 0=törzs, 1=ágak, 2=levelek
    let t = 0;

    function heart(x, y, s) {
      ctx.fillStyle = "#ff2e63";
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.bezierCurveTo(x - s, y - s, x - s*2, y + s/2, x, y + s*2);
      ctx.bezierCurveTo(x + s*2, y + s/2, x + s, y - s, x, y);
      ctx.fill();
    }

    function drawTree() {
      ctx.clearRect(0,0,c.width,c.height);

      // törzs nő
      ctx.fillStyle = "#7a4a22";
      ctx.fillRect(205, 260 - trunkH, 16, trunkH);

      // ágak (egyszerű vonalak)
      if (phase >= 1) {
        ctx.strokeStyle = "#7a4a22";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(213, 260 - trunkH);
        ctx.lineTo(213 - branches, 200 - branches);
        ctx.moveTo(213, 260 - trunkH + 20);
        ctx.lineTo(213 + branches, 210 - branches);
        ctx.stroke();
      }

      // levelek (szív szirmok)
      if (phase >= 2) {
        leaves.forEach((p,i) => {
          const pulse = 1 + Math.sin(t + i) * 0.08;
          heart(p.x, p.y, p.s * pulse);
        });
      }
    }

    function animate() {
      if (phase === 0) {
        trunkH += 2;
        if (trunkH >= 140) phase = 1;
      } else if (phase === 1) {
        branches += 2;
        if (branches >= 50) phase = 2;
      } else if (phase === 2) {
        if (leaves.length < 80) {
          leaves.push({
            x: 210 + (Math.random()*160 - 80),
            y: 160 + (Math.random()*120 - 60),
            s: 5 + Math.random()*6
          });
        }
      }

      drawTree();
      t += 0.05;
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
