<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(120deg, #ff5f9e, #ffc371);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    .card {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      width: 95%;
      max-width: 900px;
      display: flex;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
      flex-wrap: wrap;
    }

    .text {
      flex: 1 1 250px;
    }

    h1 {
      margin-top: 0;
      color: #ff4081;
    }

    #timer {
      margin-top: 12px;
      font-weight: bold;
    }

    canvas {
      flex: 1 1 250px;
      width: 100%;
      max-width: 400px;
      height: auto;
      background: #fff5f9;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="text">
      <h1>Életem szerelmének ❤️</h1>
      <p>
        Ha választhatnék egy biztonságos helyet,  
        az mindig a te oldalad lenne.
      </p>

      <div id="timer"></div>
    </div>

    <canvas id="tree" width="400" height="400"></canvas>
  </div>

  <script>
    // ⏱️ IDŐSZÁMLÁLÓ – ide írd a dátumotokat
    const startDate = new Date("2024-02-15T00:00:00");

    function updateTimer() {
      const now = new Date();
      let diff = Math.floor((now - startDate) / 1000);

      const days = Math.floor(diff / 86400);
      diff %= 86400;
      const hours = Math.floor(diff / 3600);
      diff %= 3600;
      const minutes = Math.floor(diff / 60);
      const seconds = diff % 60;

      document.getElementById("timer").innerHTML =
        `Együtt vagyunk: ${days} nap ${hours} óra ${minutes} perc ${seconds} másodperc`;
    }

    setInterval(updateTimer, 1000);
    updateTimer();

    // 🌳 SZÍV FA
    const canvas = document.getElementById("tree");
    const ctx = canvas.getContext("2d");
    const hearts = [];

    function drawHeart(x, y, s) {
      ctx.fillStyle = "#ff3b7f";
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.bezierCurveTo(x - s, y - s, x - s*2, y + s/2, x, y + s*2);
      ctx.bezierCurveTo(x + s*2, y + s/2, x + s, y - s, x, y);
      ctx.fill();
    }

    function drawTree() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#8d5a2b";
      ctx.fillRect(190, 220, 20, 120);

      hearts.forEach(h => drawHeart(h.x, h.y, h.s));
    }

    function growTree() {
      if (hearts.length < 80) {
        hearts.push({
          x: 200 + (Math.random() * 120 - 60),
          y: 200 + (Math.random() * 120 - 60),
          s: 5 + Math.random() * 5
        });
      }
      drawTree();
    }

    setInterval(growTree, 200);
  </script>

</body>
</html>
