<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Szerelmemnek</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #fdf2f2; /* Halvány rózsaszín háttér */
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* --- A KEZDŐ GOMB (SZÍV) --- */
        #start-btn {
            font-size: 80px;
            cursor: pointer;
            animation: pulse 1.5s infinite;
            z-index: 100;
            transition: transform 0.5s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* --- A TARTALOM (REJTVE KEZD) --- */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: none; /* Majd JS kapcsolja be */
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Középre igazítás */
            opacity: 0;
            transition: opacity 1s;
        }

        /* --- A FA --- */
        .tree-wrapper {
            position: relative;
            width: 320px;
            height: 400px; /* Nagyobb hely a fának */
            margin-top: -50px; /* Kicsit feljebb húzzuk */
        }

        /* Fatörzs - Sötétbarna, teli forma */
        .trunk {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) scaleY(0); /* Kezdetben nincs magassága */
            transform-origin: bottom;
            width: 120px; /* Szélesebb törzs */
            fill: #5D4037;
            transition: transform 1.5s ease-out; /* Növekedés animáció */
        }

        /* Levelek (Szívek) */
        .leaf {
            position: absolute;
            font-size: 0; /* Kezdetben 0 méret */
            color: #d32f2f;
            transform: translate(-50%, -50%);
            transition: font-size 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0.9;
        }

        /* Különböző piros árnyalatok */
        .c1 { color: #ff1744; }
        .c2 { color: #d50000; }
        .c3 { color: #ff5252; }
        .c4 { color: #ff8a80; }

        /* --- SZÖVEG ÉS SZÁMLÁLÓ --- */
        .text-content {
            text-align: center;
            z-index: 10;
            margin-top: 20px; /* Hely a fa alatt */
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease 2s; /* Késleltetve jelenik meg */
        }

        .main-text {
            font-size: 1.1rem;
            color: #4e342e;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .timer {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #c62828;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
        }
        
        /* A címadó szöveg */
        h1 {
            position: absolute;
            top: 5%;
            font-family: 'Dancing Script', cursive;
            color: #c62828;
            font-size: 2.5rem;
            width: 100%;
            text-align: center;
            opacity: 0;
            transition: opacity 1s ease 2.5s;
        }

    </style>
</head>
<body>

    <div id="start-btn" onclick="startAnimation()">❤️</div>

    <div class="container" id="main-content">
        <h1>Szerelmemnek</h1>

        <div class="tree-wrapper">
            <svg class="trunk" id="trunk" viewBox="0 0 100 200" preserveAspectRatio="none">
                 <path d="M50,200 L30,190 Q40,120 20,100 L25,95 Q45,110 50,150 Q55,110 80,90 L85,95 Q60,120 70,190 Z" />
                 <path d="M50,150 Q30,110 10,120 L12,115 Q35,100 50,140" />
                 <path d="M50,140 Q70,100 90,110 L88,105 Q65,90 50,130" />
                 <path d="M50,150 L50,80 L52,80 L52,150" />
            </svg>
            </div>

        <div class="text-content">
            <div class="main-text">Para el amor de mi vida:</div>
            <div class="main-text">Si pudiera elegir un lugar seguro, sería a tu lado.</div>
            
            <div style="margin-top: 15px; font-size: 0.9rem; color: #777;">Szerelmünk kezdete óta eltelt idő:</div>
            <div class="timer" id="timer">Számolás...</div>
        </div>
    </div>

<script>
    // --- BEÁLLÍTÁSOK ---
    // A dátum: Év, Hónap (0=Jan, 1=Feb...), Nap, Óra, Perc
    const startDate = new Date(2025, 1, 14, 20, 0); 

    // --- ANIMÁCIÓ INDÍTÁSA ---
    function startAnimation() {
        // Gomb eltüntetése
        document.getElementById('start-btn').style.display = 'none';
        
        // Tartalom megjelenítése
        const container = document.getElementById('main-content');
        container.style.display = 'flex';
        
        // Kis késleltetés, hogy a CSS transition működjön
        setTimeout(() => {
            container.style.opacity = '1';
            
            // 1. Fatörzs növesztése
            document.getElementById('trunk').style.transform = 'translateX(-50%) scaleY(1)';
            
            // 2. Levelek (Szívek) növesztése kicsit később
            setTimeout(createLeaves, 1000); // 1 mp múlva jönnek a levelek
            
            // 3. Szövegek megjelenítése
            document.querySelector('h1').style.opacity = '1';
            document.querySelector('.text-content').style.opacity = '1';
            document.querySelector('.text-content').style.transform = 'translateY(0)';
            
        }, 100);
    }

    // --- LEVELEK GENERÁLÁSA (SZÍV ALAKBAN) ---
    function createLeaves() {
        const wrapper = document.querySelector('.tree-wrapper');
        const count = 70; // Hány darab szív legyen
        
        // A "Lombkorona" közepe a fán
        const centerX = 160; // tree-wrapper szélesség fele
        const centerY = 120; // Fentebb, az ágak végénél
        
        for (let i = 0; i < count; i++) {
            const leaf = document.createElement('div');
            leaf.classList.add('leaf');
            
            // Véletlenszerű színosztály
            const colorClass = 'c' + (Math.floor(Math.random() * 4) + 1);
            leaf.classList.add(colorClass);
            leaf.innerHTML = '❤';

            // --- A MATEMATIKA (Szív görbe) ---
            // Paraméter t: 0-tól 2PI-ig
            let t = Math.random() * Math.PI * 2;
            
            // Hogy ne csak a vonalon legyenek, hanem kitöltsék a formát:
            // Egy véletlenszerű sugár-szorzó (r)
            // A gyökvonás (sqrt) azért kell, hogy egyenletes legyen az eloszlás
            let r = Math.sqrt(Math.random()); 
            
            // Szív egyenlet:
            // x = 16 * sin(t)^3
            // y = 13 * cos(t) - 5 * cos(2t) - 2 * cos(3t) - cos(4t)
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            
            // Méretezés (hogy mekkora legyen a nagy szív)
            const scale = 5.5; 
            
            // Pozicionálás
            let posX = centerX + (x * scale * r);
            let posY = centerY + (y * scale * r);

            // Kicsit "szórjuk" meg őket véletlenszerűen, hogy természetesebb legyen
            posX += (Math.random() - 0.5) * 10;
            posY += (Math.random() - 0.5) * 10;

            leaf.style.left = posX + 'px';
            leaf.style.top = posY + 'px';

            wrapper.appendChild(leaf);

            // Késleltetett megjelenés (pop-up effekt)
            setTimeout(() => {
                // Véletlenszerű méret a kis szíveknek
                const size = 15 + Math.random() * 20; 
                leaf.style.fontSize = size + 'px';
                // Véletlenszerű forgatás
                leaf.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 60 - 30}deg)`;
            }, i * 30); // Egymás után gyorsan jelennek meg
        }
    }

    // --- IDŐZÍTŐ ---
    function updateTimer() {
        const now = new Date();
        const diff = now - startDate;

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('timer').innerText = 
            `${days} nap ${hours}:${minutes}:${seconds}`;
    }

    setInterval(updateTimer, 1000);
    updateTimer();
</script>

</body>
</html>
