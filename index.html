<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Love</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      background: radial-gradient(1200px 600px at 50% -10%, #ff8fb1 0%, #ff2e63 60%, #b3123a 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      overflow:hidden;
    }
    .card{
      position:relative;
      z-index:2;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(8px);
      border-radius:22px;
      padding:22px;
      width:95%;
      max-width:960px;
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:18px;
      box-shadow: 0 30px 60px rgba(0,0,0,.35);
    }
    h1{margin:0 0 8px;color:#ff2e63;letter-spacing:.3px}
    #timer{font-weight:800}
    canvas{width:100%;max-width:420px;height:auto;border-radius:16px;background:linear-gradient(#fff0f6,#ffe3ed)}
    @media (max-width:800px){.card{grid-template-columns:1fr;text-align:center}}
  </style>
</head>
<body>
  <div class="card">
    <div>
      <h1>Életem szerelmének ❤️</h1>
      <p>Ha választhatnék egy biztonságos helyet, az mindig a te oldalad lenne.</p>
      <div id="timer"></div>
    </div>
    <canvas id="tree" width="420" height="520"></canvas>
  </div>

  <script>
    // ⏱️ dátum
    const startDate = new Date("2024-02-15T00:00:00");
    const timerEl = document.getElementById("timer");
    setInterval(() => {
      let d = Math.floor((Date.now() - startDate) / 1000);
      const days = Math.floor(d/86400); d%=86400;
      const h = Math.floor(d/3600); d%=3600;
      const m = Math.floor(d/60); const s = d%60;
      timerEl.textContent = `Együtt: ${days} nap ${h} óra ${m} perc ${s} mp`;
    }, 1000);

    // 🎨 canvas
    const c = document.getElementById("tree");
    const ctx = c.getContext("2d");
    const centerX = c.width/2;
    const baseY = c.height - 30;

    let trunkProg = 0;      // 0..1
    let branchProg = 0;     // 0..1
    let petalsProg = 0;     // 0..1
    let t = 0;

    const branches = [
      { ax: -80, ay: -90 },
      { ax:  80, ay: -90 },
      { ax: -120, ay: -150 },
      { ax:  120, ay: -150 }
    ];

    const petals = Array.from({length: 90}, () => ({
      x: centerX + (Math.random()*220 - 110),
      y: baseY - 220 + (Math.random()*160 - 80),
      s: 5 + Math.random()*6,
      delay: Math.random()
    }));

    function heart(x,y,s,alpha=1){
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#ff2e63";
      ctx.shadowColor = "#ff5f8f";
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.bezierCurveTo(x-s,y-s,x-2*s,y+s/2,x,y+2*s);
      ctx.bezierCurveTo(x+2*s,y+s/2,x+s,y-s,x,y);
      ctx.fill();
      ctx.restore();
    }

    function draw(){
      ctx.clearRect(0,0,c.width,c.height);

      // törzs rajzolódik
      const trunkH = 220 * trunkProg;
      ctx.lineCap = "round";
      ctx.strokeStyle = "#7a4a22";
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.moveTo(centerX, baseY);
      ctx.lineTo(centerX, baseY - trunkH);
      ctx.stroke();

      // ágak rajzolódnak
      if (branchProg > 0) {
        ctx.lineWidth = 8;
        branches.forEach(b => {
          ctx.beginPath();
          ctx.moveTo(centerX, baseY - trunkH*0.9);
          ctx.lineTo(
            centerX + b.ax * branchProg,
            baseY - trunkH*0.9 + b.ay * branchProg
          );
          ctx.stroke();
        });
      }

      // szív szirmok kinőnek
      petals.forEach((p,i) => {
        const local = Math.max(0, Math.min(1, petalsProg - p.delay));
        if (local > 0) {
          const pulse = 1 + Math.sin(t + i) * 0.08;
          heart(p.x, p.y, p.s * local * pulse, local);
        }
      });

      t += 0.04;
      requestAnimationFrame(draw);
    }

    function timeline(){
      if (trunkProg < 1) trunkProg += 0.01;
      else if (branchProg < 1) branchProg += 0.02;
      else if (petalsProg < 1.2) petalsProg += 0.01;
      requestAnimationFrame(timeline);
    }

    draw();
    timeline();
  </script>
</body>
</html>
