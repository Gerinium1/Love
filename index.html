<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Szerelmemnek</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap');

        :root {
            --primary: #e91e63;
            --secondary: #ff80ab;
            --trunk: #4e342e;
            --bg-color: #ffebee;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #fff0f3 0%, #ffebee 100%);
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
        }

        /* Kártya stílus */
        .card {
            position: relative;
            width: 90%;
            max-width: 400px;
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--primary);
            font-size: 3rem;
            margin: 0;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
        }

        .quote {
            color: #888;
            font-style: italic;
            margin-bottom: 30px;
            font-size: 1rem;
            line-height: 1.4;
        }

        /* --- A FA TARTÁLYA --- */
        .tree-container {
            position: relative;
            width: 300px;
            height: 350px;
            margin: 0 auto;
        }

        /* A törzs (SVG) */
        .trunk-svg {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 200px;
            overflow: visible;
            z-index: 1;
        }
        
        .trunk-path {
            fill: none;
            stroke: var(--trunk);
            stroke-width: 10; /* Vastagabb törzs */
            stroke-linecap: round;
            stroke-linejoin: round; 
        }

        /* A levelek (JS generálja) */
        .leaf {
            position: absolute;
            color: var(--primary);
            font-size: 20px;
            z-index: 2;
            opacity: 0; /* Kezdetben láthatatlan */
            transform: scale(0);
            animation: growLeaf 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            text-shadow: 0 2px 5px rgba(233, 30, 99, 0.3);
        }

        /* Különböző árnyalatok a leveleknek */
        .leaf:nth-child(2n) { color: #d81b60; }
        .leaf:nth-child(3n) { color: #ff4081; }
        .leaf:nth-child(4n) { color: #c2185b; }

        @keyframes growLeaf {
            to { opacity: 1; transform: scale(1); }
        }

        /* Lebegő animáció az egész fának */
        .floating-tree {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- Számláló --- */
        .timer-box {
            background: white;
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(233, 30, 99, 0.15);
            margin-top: -30px; /* Hogy kicsit rálógjon a fára alul */
            position: relative;
            z-index: 20;
            display: inline-block;
            border: 2px solid #fff;
        }

        .timer-text {
            color: var(--primary);
            font-weight: 700;
            font-size: 1.1rem;
        }
        
        .timer-label {
            display: block;
            font-size: 0.8rem;
            color: #999;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Háttér effekt */
        .bg-particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 128, 171, 0.3);
            animation: rise 15s infinite linear;
        }
        @keyframes rise {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-20vh) scale(1); opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="bg-particles" id="particles"></div>

    <div class="card">
        <h1>Szerelmemnek</h1>
        <p class="quote">"Minden pillanat ajándék veled."</p>

        <div class="tree-container floating-tree" id="tree-area">
            <svg class="trunk-svg" viewBox="0 0 100 200">
                <path class="trunk-path" d="M50,200 Q50,150 50,120 Q50,80 30,60 M50,120 Q50,80 70,60 M50,120 L50,40" />
            </svg>
            </div>

        <div class="timer-box">
            <span class="timer-label">Együtt töltött időnk:</span>
            <div id="timer" class="timer-text">Számolás...</div>
        </div>
    </div>

<script>
    // ----------------------------------------------------
    // 1. BEÁLLÍTÁSOK (DÁTUM)
    // ----------------------------------------------------
    const startDate = new Date(2023, 1, 14, 18, 0); // Év, Hónap (0=Jan, 1=Feb), Nap, Óra

    // ----------------------------------------------------
    // 2. SZÁMLÁLÓ LOGIKA
    // ----------------------------------------------------
    function updateTimer() {
        const now = new Date();
        const diff = now - startDate;

        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const m = Math.floor((diff / 1000 / 60) % 60);
        const s = Math.floor((diff / 1000) % 60);

        document.getElementById('timer').innerText = 
            `${d} nap ${h} óra ${m} perc ${s} mp`;
    }
    setInterval(updateTimer, 1000);
    updateTimer();

    // ----------------------------------------------------
    // 3. A LOMBKORONA GENERÁLÁSA (A Nagy Szív)
    // ----------------------------------------------------
    function createTreeLeaves() {
        const container = document.getElementById('tree-area');
        const centerX = 150; // A konténer közepe
        const centerY = 120; // A lombkorona közepe (fentebb)
        const scale = 7;     // Mennyire legyen nagy a szív

        // 60 db szívecske generálása matematikai szív alakzat mentén
        for (let i = 0; i < 60; i++) {
            const leaf = document.createElement('div');
            leaf.classList.add('leaf');
            leaf.innerHTML = '❤';
            
            // Véletlenszerű eloszlás a szív alakban
            // Paraméteres szív egyenlet
            const t = Math.random() * Math.PI * 2;
            
            // Kicsit szórjuk a pontokat, hogy dús hatása legyen (random)
            const r = scale * (Math.sqrt(Math.random())); 
            
            // Szív formula módosítva a kitöltéshez
            // x = 16sin^3(t)
            // y = 13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t)
            
            // Itt egy egyszerűsített elosztást használunk, hogy "tömött" legyen
            // Random pozíciók egy képzeletbeli dobozban, de csak ha szív alakban vannak?
            // Helyette: Egyszerűbb módszer, random eltolás a középponttól
            
            // Jobb módszer: Spirálban vagy véletlenszerűen elhelyezni őket egy nagy körben, 
            // de mi szív alakot akarunk. Használjuk a fix koordinátákat kis szórással.
            
            let angle = Math.random() * Math.PI * 2;
            // Szív alak koordináták
            let x = 16 * Math.pow(Math.sin(angle), 3);
            let y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));
            
            // Méretezés + Random szórás (hogy ne csak a vonalon legyenek)
            let randomScale = (Math.random() * 0.5 + 0.5) * scale; 
            
            // Ha azt akarjuk, hogy belül is legyenek levelek:
            let fillFactor = Math.sqrt(Math.random()); // Kitöltés
            
            leaf.style.left = (centerX + (x * randomScale * fillFactor)) + 'px';
            leaf.style.top = (centerY + (y * randomScale * fillFactor)) + 'px';
            
            // Random méret a kis szíveknek
            leaf.style.fontSize = (Math.random() * 15 + 10) + 'px';
            
            // Random forgatás
            leaf.style.transform = `rotate(${Math.random() * 60 - 30}deg)`;
            
            // Késleltetett megjelenés
            leaf.style.animationDelay = (Math.random() * 2) + 's';

            container.appendChild(leaf);
        }
    }

    // ----------------------------------------------------
    // 4. HÁTTÉR RÉSZECSKÉK
    // ----------------------------------------------------
    function createParticles() {
        const bg = document.getElementById('particles');
        for(let i=0; i<20; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            p.style.left = Math.random() * 100 + '%';
            p.style.width = Math.random() * 20 + 'px';
            p.style.height = p.style.width;
            p.style.animationDuration = Math.random() * 10 + 10 + 's';
            p.style.animationDelay = Math.random() * -20 + 's';
            bg.appendChild(p);
        }
    }

    createTreeLeaves();
    createParticles();
</script>

</body>
</html>
