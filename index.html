<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Love</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #ff7aa2, #ff2e63);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      position: relative;
      z-index: 2;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(6px);
      padding: 20px;
      border-radius: 20px;
      width: 95%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,.25);
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    h1 { margin: 0 0 8px; color: #ff2e63; }
    #timer { font-weight: 700; }

    canvas {
      width: 100%;
      max-width: 420px;
      height: auto;
      background: linear-gradient(#fff0f6, #ffe3ed);
      border-radius: 16px;
    }

    /* Lebegő szívek */
    .heart {
      position: absolute;
      bottom: -40px;
      font-size: 18px;
      opacity: 0.8;
      animation: rise linear forwards;
      pointer-events: none;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.2));
    }

    @keyframes rise {
      from { transform: translateY(0) scale(.8); opacity: .9; }
      to   { transform: translateY(-120vh) scale(1.4); opacity: 0; }
    }

    @media (max-width: 700px) {
      .card { grid-template-columns: 1fr; text-align: center; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div>
      <h1>Életem szerelmének ❤️</h1>
      <p>Ha választhatnék egy biztonságos helyet, az mindig a te oldalad lenne.</p>
      <div id="timer"></div>
    </div>
    <canvas id="tree" width="420" height="420"></canvas>
  </div>

  <script>
    // ⏱️ DÁTUM – IDE ÍRD A TIÉTEKET
    const startDate = new Date("2024-02-15T00:00:00");

    function updateTimer() {
      const now = new Date();
      let d = Math.floor((now - startDate) / 1000);
      const days = Math.floor(d / 86400); d %= 86400;
      const h = Math.floor(d / 3600); d %= 3600;
      const m = Math.floor(d / 60);
      const s = d % 60;
      document.getElementById("timer").innerText =
        `Együtt: ${days} nap ${h} óra ${m} perc ${s} mp`;
    }
    setInterval(updateTimer, 1000); updateTimer();

    // 🌳 FA + pulzáló levelek
    const c = document.getElementById("tree");
    const ctx = c.getContext("2d");
    const leaves = [];
    let t = 0;

    function heart(x, y, s, hue) {
      ctx.fillStyle = `hsl(${hue}, 80%, 60%)`;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.bezierCurveTo(x - s, y - s, x - s*2, y + s/2, x, y + s*2);
      ctx.bezierCurveTo(x + s*2, y + s/2, x + s, y - s, x, y);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0,0,c.width,c.height);
      // törzs
      ctx.fillStyle = "#7a4a22";
      ctx.fillRect(205, 230, 18, 140);

      leaves.forEach((p,i) => {
        const pulse = 1 + Math.sin(t + i) * 0.06;
        heart(p.x, p.y, p.s * pulse, p.h);
      });

      t += 0.05;
      requestAnimationFrame(draw);
    }

    function grow() {
      if (leaves.length < 90) {
        leaves.push({
          x: 210 + (Math.random()*160 - 80),
          y: 210 + (Math.random()*140 - 70),
          s: 5 + Math.random()*6,
          h: 330 + Math.random()*20
        });
      }
    }
    setInterval(grow, 120);
    draw();

    // 💗 Lebegő szívek generátor
    function spawnHeart() {
      const el = document.createElement("div");
      el.className = "heart";
      el.textContent = Math.random() > .5 ? "💗" : "❤️";
      el.style.left = Math.random() * 100 + "vw";
      el.style.animationDuration = 6 + Math.random()*6 + "s";
      el.style.fontSize = 14 + Math.random()*22 + "px";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 12000);
    }
    setInterval(spawnHeart, 400);
  </script>
</body>
</html>
